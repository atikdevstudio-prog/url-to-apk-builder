name: Build APK from Webview URL

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'My Web App'
      target_url:
        description: 'Target Website URL'
        required: true
        default: 'https://example.com'
      package_name:
        description: 'Package Name'
        required: false
        default: 'com.mycompany.myapp'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Gradle Wrapper if Missing
      run: |
        if [ ! -f "./gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Dynamic Code Replacement
      run: |
        APP_NAME="${{ github.event.client_payload.app_name || inputs.app_name }}"
        TARGET_URL="${{ github.event.client_payload.target_url || inputs.target_url }}"
        
        # Replace values in strings.xml
        sed -i "s|APP_NAME_PLACEHOLDER|$APP_NAME|g" app/src/main/res/values/strings.xml
        sed -i "s|WEB_URL_PLACEHOLDER|$TARGET_URL|g" app/src/main/res/values/strings.xml

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.client_payload.app_name || inputs.app_name }}-APK
        path: app/build/outputs/apk/debug/app-debug.apk
