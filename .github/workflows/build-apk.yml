name: Build APK from Webview URL

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Update Strings with User Input
      run: |
        APP_NAME="${{ github.event.client_payload.app_name }}"
        TARGET_URL="${{ github.event.client_payload.target_url }}"
        
        sed -i "s|APP_NAME_PLACEHOLDER|$APP_NAME|g" app/src/main/res/values/strings.xml
        sed -i "s|WEB_URL_PLACEHOLDER|$TARGET_URL|g" app/src/main/res/values/strings.xml

    - name: Grant Execute Permission for Gradle
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.client_payload.job_id }}.apk
        path: app/build/outputs/apk/debug/app-debug.apk
